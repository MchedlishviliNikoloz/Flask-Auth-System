<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — FlaskAuth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink:       #1a1a1a;
            --ink-soft:  #4a4a4a;
            --ink-muted: #888;
            --canvas:    #f7f6f2;
            --surface:   #ffffff;
            --border:    #e2e0d8;
            --border-focus: #1a1a1a;
            --accent:    #1a1a1a;
            --accent-fg: #ffffff;
            --error-bg:  #fff5f5;
            --error-border: #f5c6c6;
            --error-text: #b91c1c;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-card: 0 2px 4px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.07), 0 24px 48px rgba(0,0,0,0.05);
            --transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { height: 100%; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--canvas);
            background-image:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(26,26,26,0.04) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 85% 85%, rgba(26,26,26,0.03) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .brand {
            font-family: 'DM Serif Display', serif;
            font-size: 15px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-muted);
            margin-bottom: 32px;
            opacity: 0;
            animation: fadeUp 0.5s 0.05s ease forwards;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 44px 40px 40px;
            border: 1px solid var(--border);
            opacity: 0;
            animation: fadeUp 0.5s 0.1s ease forwards;
        }

        .card-header {
            margin-bottom: 32px;
        }

        .card-header h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 34px;
            font-weight: 400;
            color: var(--ink);
            line-height: 1.15;
            margin-bottom: 6px;
        }

        .card-header .subtitle {
            font-size: 14px;
            color: var(--ink-muted);
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        /* ── Error block ── */
        .errors {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 24px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            animation: shakeIn 0.35s ease;
        }

        .errors-icon {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            margin-top: 1px;
            color: var(--error-text);
        }

        .errors-body {
            flex: 1;
        }

        .errors-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--error-text);
            margin-bottom: 4px;
        }

        .errors ul {
            list-style: none;
        }

        .errors li {
            font-size: 13px;
            color: var(--error-text);
            line-height: 1.5;
        }

        .errors li + li {
            margin-top: 2px;
        }

        /* ── Form ── */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-soft);
            margin-bottom: 7px;
            letter-spacing: 0.02em;
        }

        .input-group input {
            width: 100%;
            padding: 13px 15px;
            background: var(--canvas);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            color: var(--ink);
            outline: none;
            transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
        }

        .input-group input::placeholder {
            color: #bbb;
        }

        .input-group input:focus {
            border-color: var(--border-focus);
            background: var(--surface);
            box-shadow: 0 0 0 3px rgba(26,26,26,0.07);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            background: var(--accent);
            color: var(--accent-fg);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.01em;
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-top: 8px;
            transition: opacity var(--transition), transform var(--transition);
        }

        .login-btn:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
            opacity: 1;
        }

        /* ── Bottom link ── */
        .bottom-text {
            margin-top: 24px;
            text-align: center;
            font-size: 13.5px;
            color: var(--ink-muted);
        }

        .bottom-text a {
            color: var(--ink);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1.5px solid transparent;
            transition: border-color var(--transition);
        }

        .bottom-text a:hover {
            border-bottom-color: var(--ink);
        }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 28px 0;
        }

        /* ── Animations ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes shakeIn {
            0%   { transform: translateX(0); }
            20%  { transform: translateX(-4px); }
            40%  { transform: translateX(4px); }
            60%  { transform: translateX(-3px); }
            80%  { transform: translateX(3px); }
            100% { transform: translateX(0); }
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .card {
                padding: 32px 24px 28px;
            }
            .card-header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

<div class="brand">FlaskAuth</div>

<div class="card">
    <div class="card-header">
        <h1>Welcome back.</h1>
        <p class="subtitle">Sign in to your account to continue.</p>
    </div>

    {% if errors %}
    <div class="errors">
        <svg class="errors-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="10" r="8.5"/>
            <line x1="10" y1="6.5" x2="10" y2="10.5"/>
            <circle cx="10" cy="13.5" r="0.6" fill="currentColor" stroke="none"/>
        </svg>
        <div class="errors-body">
            <div class="errors-title">Please fix the following</div>
            <ul>
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>
    {% endif %}

    <form method="POST">
        <div class="input-group">
            <label>Username or Email</label>
            <input
                type="text"
                name="login_input"
                placeholder="you@example.com"
                required
            >
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Your password"
                required
            >
        </div>

        <button type="submit" class="login-btn">Sign In</button>
    </form>

    <div class="divider"></div>

    <div class="bottom-text">
        Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
    </div>
</div>

</body>
</html>
