<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>404 — Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:       #1a1a1a;
            --ink-soft:  #4a4a4a;
            --ink-muted: #888;
            --canvas:    #f7f6f2;
            --surface:   #ffffff;
            --border:    #e2e0d8;
            --accent:    #1a1a1a;
            --accent-fg: #ffffff;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.06);
            --transition: 180ms cubic-bezier(0.4,0,0.2,1);
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--canvas);
            background-image:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(26,26,26,0.04) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 85% 85%, rgba(26,26,26,0.03) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--ink);
        }

        .wrap {
            text-align: center;
            max-width: 420px;
            opacity: 0;
            animation: fadeUp 0.55s 0.05s ease forwards;
        }

        /* Big 404 */
        .code {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(96px, 18vw, 140px);
            font-weight: 400;
            line-height: 1;
            color: var(--ink);
            letter-spacing: -4px;
            margin-bottom: 4px;
            user-select: none;
        }

        .code span {
            color: var(--ink-muted);
            opacity: 0.25;
        }

        .divider {
            width: 40px; height: 2px;
            background: var(--border);
            margin: 24px auto;
            border-radius: 99px;
        }

        .title {
            font-family: 'DM Serif Display', serif;
            font-size: 26px; font-weight: 400;
            color: var(--ink);
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .desc {
            font-size: 15px;
            color: var(--ink-muted);
            line-height: 1.65;
            margin-bottom: 36px;
        }

        /* Buttons */
        .actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 11px 20px;
            border-radius: var(--radius-sm);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px; font-weight: 500;
            text-decoration: none; cursor: pointer;
            border: none;
            transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: var(--accent); color: var(--accent-fg);
        }
        .btn-primary:hover { opacity: 0.88; }

        .btn-ghost {
            background: var(--surface); color: var(--ink-soft);
            border: 1.5px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .btn-ghost:hover { color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        /* Brand */
        .brand {
            position: fixed;
            top: 28px; left: 50%;
            transform: translateX(-50%);
            font-family: 'DM Serif Display', serif;
            font-size: 15px; letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink-muted);
            text-decoration: none;
            opacity: 0;
            animation: fadeDown 0.4s 0s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity:0; transform:translateY(16px); }
            to   { opacity:1; transform:translateY(0); }
        }
        @keyframes fadeDown {
            from { opacity:0; transform:translateX(-50%) translateY(-8px); }
            to   { opacity:1; transform:translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>

<a href="{{ url_for('main.home') }}" class="brand">FlaskAuth</a>

<div class="wrap">
    <div class="code">4<span>0</span>4</div>
    <div class="divider"></div>
    <div class="title">Page not found.</div>
    <p class="desc">
        The page you're looking for doesn't exist,<br>
        was moved, or the link might be broken.
    </p>
    <div class="actions">
        <a href="{{ url_for('main.home') }}" class="btn btn-primary">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10l7-7 7 7"/><path d="M5 8v9h4v-5h2v5h4V8"/>
            </svg>
            Go home
        </a>
        <a href="javascript:history.back()" class="btn btn-ghost">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5l-5 5 5 5"/>
            </svg>
            Go back
        </a>
    </div>
</div>

</body>
</html>
